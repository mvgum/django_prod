version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=your_db_name
      - POSTGRES_USER=your_db_user
      - POSTGRES_PASSWORD=your_db_password

  web:
    build: .
    # Политика restart: always — при падении контейнер перезапустится [citation:5][citation:17]
    restart: always
    # Флаг DJANGO_DEBUG=1 для работы статики в этом задании
    environment:
      - DJANGO_DEBUG=1
      - DATABASE_URL=postgres://your_db_user:your_db_password@db:5432/your_db_name
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
